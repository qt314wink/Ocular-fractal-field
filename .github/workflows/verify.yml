name: Verify Foundation

on:
  push:
    branches:
      - main
      - foundation/gates-0-1-determinism
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Validate Gates 0–1 foundation
        run: pnpm validate
